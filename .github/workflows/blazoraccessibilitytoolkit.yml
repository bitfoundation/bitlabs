name: BlazorAccessibilityToolkit

on:
  push:
    branches: [main]
    paths:
      - 'BlazorAccessibilityToolkit/**'
      - '.github/workflows/blazoraccessibilitytoolkit.yml'
  pull_request:
    paths:
      - 'BlazorAccessibilityToolkit/**'
      - '.github/workflows/blazoraccessibilitytoolkit.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: BlazorAccessibilityToolkit

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Test (${{ matrix.browser }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # SARIF upload to code scanning
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      BLAZOR_A11Y_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4

      # Paths of `uses:` steps are relative to the repository root, not to the default working directory.
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: BlazorAccessibilityToolkit/global.json

      - name: Build
        run: dotnet build BlazorAccessibilityToolkit.slnx -c Release

      - name: Install Playwright browser
        run: pwsh tests/BlazorAccessibilityToolkit.Playwright.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps ${{ matrix.browser }}

      - name: Toolkit tests
        run: >
          dotnet test BlazorAccessibilityToolkit.slnx -c Release --no-build -m:1
          --filter "FullyQualifiedName!~BlazorAccessibilityToolkit.Demo"
          --logger "trx;LogFilePrefix=toolkit" --results-directory TestResults

      # The demo tests write one result file per audit; the CLI turns them into reports and the CI gate.
      - name: Demo accessibility tests
        env:
          BLAZOR_A11Y_RESULTS_DIR: ${{ github.workspace }}/BlazorAccessibilityToolkit/a11y-results
        run: |
          dotnet test demo/BlazorAccessibilityToolkit.Demo.ComponentTests -c Release --no-build --logger "trx;LogFilePrefix=components" --results-directory TestResults
          dotnet test demo/BlazorAccessibilityToolkit.Demo.EndToEndTests -c Release --no-build --logger "trx;LogFilePrefix=e2e" --results-directory TestResults

      # Runs from the repository root: SARIF locations are relative to the working directory, and code scanning resolves
      # them against the repository root, so they must include the BlazorAccessibilityToolkit/ prefix. The built tool is
      # started directly, because the repository root has no global.json to select the SDK that `dotnet run` would need.
      - name: Accessibility gate
        working-directory: .
        run: >
          dotnet BlazorAccessibilityToolkit/src/BlazorAccessibilityToolkit.Cli/bin/Release/net10.0/BlazorAccessibilityToolkit.Cli.dll
          report
          --input BlazorAccessibilityToolkit/a11y-results
          --baseline BlazorAccessibilityToolkit/demo/a11y-baseline.json
          --manual-review BlazorAccessibilityToolkit/demo/a11y/manual/modal-dialog.json
          --output BlazorAccessibilityToolkit/a11y-report
          --source-root BlazorAccessibilityToolkit/demo
          --sarif-fallback-uri BlazorAccessibilityToolkit/demo/BlazorAccessibilityToolkit.Demo.EndToEndTests/PageTests.cs
          --step-summary

      # Optional: show findings in GitHub code scanning (requires code scanning to be enabled for the repository).
      - name: Upload SARIF
        if: always() && matrix.browser == 'chromium' && hashFiles('BlazorAccessibilityToolkit/a11y-report/accessibility.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: BlazorAccessibilityToolkit/a11y-report/accessibility.sarif
          category: blazoraccessibilitytoolkit-accessibility

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blazoraccessibilitytoolkit-test-results-${{ matrix.browser }}
          path: BlazorAccessibilityToolkit/TestResults

      - name: Upload accessibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blazoraccessibilitytoolkit-a11y-report-${{ matrix.browser }}
          path: BlazorAccessibilityToolkit/a11y-report
          if-no-files-found: warn

  hybrid:
    # Blazor Hybrid apps render in WebView2, which only runs on Windows (the test job skips these tests on Linux).
    name: Blazor Hybrid (Windows, WebView2)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: BlazorAccessibilityToolkit/global.json

      - name: Hybrid tests
        run: >
          dotnet test tests/Hybrid/BlazorAccessibilityToolkit.Hybrid.Tests -c Release
          --logger "trx;LogFilePrefix=hybrid" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blazoraccessibilitytoolkit-test-results-hybrid
          path: BlazorAccessibilityToolkit/TestResults
          if-no-files-found: warn

  pack:
    name: Pack
    runs-on: ubuntu-latest
    needs: [test, hybrid]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: BlazorAccessibilityToolkit/global.json

      - name: Pack
        run: |
          for project in src/*/*.csproj; do
            dotnet pack "$project" -c Release -o artifacts/packages
          done

      - uses: actions/upload-artifact@v4
        with:
          name: blazoraccessibilitytoolkit-packages
          path: BlazorAccessibilityToolkit/artifacts/packages
